name: Mindustry bridge

on:
  push:
    paths:
      - 'mindustry/**'
      - '.github/workflows/mindustry.yml'
  pull_request:
    paths:
      - 'mindustry/**'
      - '.github/workflows/mindustry.yml'

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
        working-directory: mindustry/controller

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon jar
        working-directory: mindustry/plugin

  m1-real-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test real authenticated construction by a real Poly BuilderAI unit
        run: python3 mindustry/integration/m1_live.py
