name: Mindustry Linux PC profile

on:
  push:
    paths:
      - 'mindustry/linux/**'
      - 'mindustry/plugin/**'
      - '.github/workflows/mindustry-linux-pc.yml'
  pull_request:
    paths:
      - 'mindustry/linux/**'
      - 'mindustry/plugin/**'
      - '.github/workflows/mindustry-linux-pc.yml'

jobs:
  linux-pc-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python code validation
        run: |
          python3 -m py_compile mindustry/linux/test_pc_profile.py
          python3 -m unittest discover -s mindustry/linux -p '*_unit.py' -v
      - name: Run real constrained game server (Linux / Mint-compatible)
        run: |
          python3 mindustry/linux/test_pc_profile.py --install-dir "$RUNNER_TEMP/mindustry-pc" --duration 35 --cores 2 --heap-mb 640
      - name: Verify game evidence and limitations
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "mindustry-pc/reports/pc-validation-linux.json").read_text())
          assert report["status"] == "passed", report["failure"]
          assert report["results"]["successfulSamples"] >= 25
          assert report["results"]["tickDelta"] > 0
          assert report["restrictions"]["javaMaxHeapMb"] == 640
          assert report["restrictions"]["javaActiveProcessorCount"] == 2
          assert report["results"]["commandsExecuted"] == 0
          assert not report["restrictions"]["totalMachineRamLimitedTo8Gb"]
          assert not report["restrictions"]["gpuEmulated"]
          print("Validated:", report["results"]["successfulSamples"], "live samples,",
                report["results"]["tickDelta"], "ticks")
          PY
      - name: Publish Linux PC-profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-linux-pc-profile
          path: ${{ runner.temp }}/mindustry-pc/reports/pc-validation-linux.json
          if-no-files-found: warn
          retention-days: 14
