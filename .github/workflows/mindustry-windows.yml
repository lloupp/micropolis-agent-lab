name: Mindustry Windows installer

on:
  push:
    paths:
      - 'mindustry/windows/**'
      - 'mindustry/plugin/**'
      - '.github/workflows/mindustry-windows.yml'
  pull_request:
    paths:
      - 'mindustry/windows/**'
      - 'mindustry/plugin/**'
      - '.github/workflows/mindustry-windows.yml'

jobs:
  install-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem mindustry/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser failed: $($_.Name)"
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute real install-only with download verification and javac
        shell: powershell
        run: |
          $ref = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          & .\mindustry\windows\Iniciar-MindustryAgentLab.ps1 -InstallDir "$env:RUNNER_TEMP\MindustryAgentLab" -InstallOnly -NoClient -NoObserver -RepositoryRef $ref
          if (-not (Test-Path "$env:RUNNER_TEMP\MindustryAgentLab\server\config\mods\mindustry-agent-lab-plugin.jar")) {
            throw 'Plugin missing after Windows setup'
          }
          & "$env:JAVA_HOME\bin\jar.exe" tf "$env:RUNNER_TEMP\MindustryAgentLab\server\config\mods\mindustry-agent-lab-plugin.jar" | Select-String -Pattern 'plugin.json'

      - name: Benchmark real server with PC-like CPU and JVM limits
        shell: powershell
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'MindustryAgentLab'
          $report = Join-Path $base 'reports\pc-validation.json'
          & .\mindustry\windows\Testar-MindustryPC.ps1 -InstallDir $base -DurationSeconds 35 -CpuCores 2 -MaxHeapMb 640 -ReportPath $report
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.results.successfulSamples -lt 20 -or $result.results.tickDelta -le 0) {
            throw 'PC-like benchmark did not validate real progress'
          }
          if ($result.restrictions.javaMaxHeapMb -ne 640 -or $result.restrictions.javaActiveProcessorCount -ne 2) {
            throw 'CPU/JVM test limits were not recorded'
          }
          Write-Host ("PC-like live test: {0} samples, {1} ticks, RAM peak {2} MB" -f $result.results.successfulSamples, $result.results.tickDelta, $result.results.peakServerWorkingSetMb)

      - name: Publish PC-profile validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-windows-pc-profile
          path: ${{ runner.temp }}/MindustryAgentLab/reports/pc-validation.json
          if-no-files-found: warn
          retention-days: 14
