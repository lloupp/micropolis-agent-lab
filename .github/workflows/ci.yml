name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
      - run: corepack enable
      - run: npm run setup
      - run: npm run verify:reset
      - run: npm run verify:julia-shadow:mock
      - run: corepack pnpm --filter micropolis check
        working-directory: .vendor/MicropolisCore
